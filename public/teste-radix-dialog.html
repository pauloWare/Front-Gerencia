<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Teste Radix Dialog</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/@radix-ui/react-dialog@1.0.5/dist/index.mjs" type="module"></script>
  <style>
    body { font-family: system-ui; padding: 20px; background: #f1f5f9; }
    .log { padding: 12px; margin: 8px 0; border-radius: 6px; background: #fff; border: 1px solid #e2e8f0; font-size: 12px; }
    .success { background: #d4edda; }
    .error { background: #f8d7da; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    // Teste simplificado sem Radix para ver se o problema é lá
    function TesteSemRadix() {
      const [modalAberto, setModalAberto] = useState(false);
      const [logs, setLogs] = useState([]);

      const addLog = (msg, type = 'info') => {
        setLogs(prev => [...prev, { msg, type }]);
      };

      return (
        <div>
          <h1>Teste SEM Radix Dialog</h1>
          
          <div style={{ background: '#fff', padding: '16px', borderRadius: '8px', marginBottom: '16px', maxHeight: '200px', overflow: 'auto' }}>
            <h3>Logs:</h3>
            {logs.map((log, i) => (
              <div key={i} className={`log ${log.type}`}>
                {log.msg}
              </div>
            ))}
          </div>

          <button onClick={() => { setModalAberto(true); addLog('Modal ABERTO', 'success'); }}>
            Abrir Modal
          </button>

          {modalAberto && (
            <div style={{ 
              position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.3)', 
              zIndex: 50, display: 'flex', alignItems: 'center', justifyContent: 'center' 
            }}>
              <div style={{ 
                background: '#fff', padding: '24px', borderRadius: '12px', 
                maxWidth: '400px', width: '90%', boxShadow: '0 10px 25px rgba(0,0,0,0.1)' 
              }}>
                <h3>Modal Funcionando!</h3>
                <p>Se você está vendo isso, o modal funciona sem Radix UI.</p>
                <button onClick={() => { setModalAberto(false); addLog('Modal FECHADO', 'info'); }}>
                  Fechar
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<TesteSemRadix />);
  </script>
</body>
</html>
