<!DOCTYPE html>
<html>
<head>
  <title>Teste Pagamento</title>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
  <style>
    body { font-family: system-ui; padding: 20px; max-width: 800px; margin: 0 auto; }
    .test { padding: 15px; margin: 10px 0; border-radius: 8px; border: 1px solid #ddd; }
    .success { background: #d4edda; border-color: #c3e6cb; }
    .error { background: #f8d7da; border-color: #f5c6cb; }
    button { padding: 10px 20px; margin: 5px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Teste Real do Pagamento</h1>
  <div id="tests"></div>

  <script>
    const api = axios.create({
      baseURL: 'http://localhost:8080/api',
      headers: { 'Content-Type': 'application/json' }
    });

    function log(id, msg, isError = false) {
      const div = document.createElement('div');
      div.className = 'test ' + (isError ? 'error' : 'success');
      div.innerHTML = `<strong>${id}</strong><br><pre>${msg}</pre>`;
      document.getElementById('tests').appendChild(div);
    }

    async function runTests() {
      // Teste 1: GET mensalidades
      try {
        const r1 = await api.get('/mensalidade');
        log('GET /mensalidade', `OK - ${r1.data.length} mensalidades encontradas`);
      } catch(e) {
        log('GET /mensalidade', 'ERRO: ' + (e.response?.status || e.message), true);
      }

      // Teste 2: POST pagar (exatamente como React faz)
      try {
        const payload = {
          valor: 150.0,
          dataPagamento: '2026-01-15',
          formaPagamento: 'PIX',
          usuarioResponsavel: 'admin@academia.com'
        };
        log('POST /pagar - Enviando', JSON.stringify(payload, null, 2));
        const r2 = await api.post('/mensalidade/16/pagar', payload);
        log('POST /pagar', `OK - Status: ${r2.data.status}, Valor: ${r2.data.valor}, Forma: ${r2.data.formaPagamento}`);
      } catch(e) {
        log('POST /pagar', 'ERRO: ' + JSON.stringify(e.response?.data || e.message, null, 2), true);
      }

      // Teste 3: Verificar se receita foi criada
      try {
        const r3 = await api.get('/financeiro/receitas');
        const receitasMensalidade = r3.data.filter(r => r.tipo === 'MENSALIDADE');
        log('GET /receitas', `OK - ${r3.data.length} receitas (${receitasMensalidade.length} de MENSALIDADE)`);
      } catch(e) {
        log('GET /receitas', 'ERRO: ' + (e.response?.status || e.message), true);
      }
    }

    runTests();
  </script>
</body>
</html>
