<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Teste Dialog - Radix UI</title>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
  <style>
    body { font-family: system-ui; padding: 20px; max-width: 1200px; margin: 0 auto; background: #f1f5f9; }
    .test { padding: 16px; margin: 12px 0; border-radius: 8px; border: 1px solid #ddd; background: #fff; }
    .success { background: #d4edda; }
    .error { background: #f8d7da; }
    button { padding: 8px 16px; margin: 4px; cursor: pointer; border: none; border-radius: 6px; background: #1a56db; color: #fff; }
    .btn-secondary { background: #64748b; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 50; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal-content { background: #fff; padding: 24px; border-radius: 12px; max-width: 400px; width: 90%; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; }
    input, select { width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; }
    .btn-row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  </style>
</head>
<body>
  <h1>Teste Dialog + Pagamento (simula Radix UI)</h1>
  <div id="app"></div>

  <script>
    const api = axios.create({
      baseURL: 'http://localhost:8080/api',
      headers: { 'Content-Type': 'application/json' }
    });

    let modalAberto = false;
    let mensalidadeAtual = null;

    function log(msg, type = 'info') {
      const div = document.createElement('div');
      div.className = 'test ' + type;
      div.innerHTML = `<pre>${msg}</pre>`;
      document.getElementById('app').appendChild(div);
    }

    function abrirModal(m) {
      mensalidadeAtual = m;
      modalAberto = true;
      document.getElementById('modal').classList.add('open');
      document.getElementById('modal-info').textContent = 
        `Aluno: ${m.aluno?.nome} — Vencimento: ${m.dataVencimento} — Valor: R$ ${m.valor}`;
      document.getElementById('modal-valor').value = m.valor || '';
      document.getElementById('modal-data').value = new Date().toISOString().split('T')[0];
      document.getElementById('modal-forma').value = '';
      document.getElementById('modal-erro').textContent = '';
      log('✅ Modal ABERTO', 'success');
    }

    function fecharModal() {
      modalAberto = false;
      mensalidadeAtual = null;
      document.getElementById('modal').classList.remove('open');
      log(' Modal FECHADO', 'info');
    }

    async function confirmarPagamento(e) {
      e.preventDefault();
      
      const valor = document.getElementById('modal-valor').value;
      const dataPagamento = document.getElementById('modal-data').value;
      const formaPagamento = document.getElementById('modal-forma').value;
      
      if (!formaPagamento) {
        document.getElementById('modal-erro').textContent = 'Selecione a forma de pagamento.';
        return;
      }
      
      try {
        log(`📤 Enviando POST /mensalidade/${mensalidadeAtual.id}/pagar...`, 'info');
        
        const payload = {
          valor: Number(valor),
          dataPagamento,
          formaPagamento,
          usuarioResponsavel: 'admin@academia.com'
        };
        
        const resp = await api.post(`/mensalidade/${mensalidadeAtual.id}/pagar`, payload);
        
        log(`✅ PAGAMENTO CONFIRMADO!\nStatus: ${resp.status}\nMensalidade: ${resp.data.id}\nNovo Status: ${resp.data.status}\nValor: ${resp.data.valor}\nForma: ${resp.data.formaPagamento}\nData: ${resp.data.dataPagamento}`, 'success');
        
        fecharModal();
        carregarMensalidades();
        
      } catch (e) {
        log(`❌ ERRO NO PAGAMENTO:\n${JSON.stringify(e.response?.data || e.message, null, 2)}`, 'error');
      }
    }

    async function carregarMensalidades() {
      try {
        const resp = await api.get('/mensalidade');
        const mensalidades = resp.data;
        
        const html = mensalidades.map(m => `
          <tr>
            <td>${m.id}</td>
            <td>${m.aluno?.nome || 'N/A'}</td>
            <td>${m.dataVencimento}</td>
            <td>R$ ${Number(m.valor).toFixed(2)}</td>
            <td>${m.status}</td>
            <td>
              ${m.status !== 'PAGA' && m.status !== 'PAGO' ? 
                `<button onclick='abrirModal(${JSON.stringify(m).replace(/'/g, "&#39;")})'>Registrar Pagamento</button>` : 
                '<span style="color: #10b981;">✓ Paga</span>'}
            </td>
          </tr>
        `).join('');
        
        document.getElementById('tabela-body').innerHTML = html;
        log(`✅ ${mensalidades.length} mensalidades carregadas`, 'success');
        
      } catch (e) {
        log(`❌ Erro ao carregar: ${e.message}`, 'error');
      }
    }

    // Inicializar
    document.getElementById('app').innerHTML = `
      <button onclick="carregarMensalidades()">🔄 Carregar Mensalidades</button>
      
      <table border="1" cellpadding="10" cellspacing="0" style="width: 100%; margin-top: 20px; border-collapse: collapse;">
        <thead>
          <tr style="background: #f8fafc;">
            <th>ID</th>
            <th>Aluno</th>
            <th>Vencimento</th>
            <th>Valor</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabela-body"></tbody>
      </table>

      <div id="modal" class="modal-overlay">
        <div class="modal-content">
          <h3>Registrar Pagamento</h3>
          <p id="modal-info" style="color: #64748b; font-size: 14px; margin-bottom: 16px;"></p>
          <form onsubmit="confirmarPagamento(event)">
            <div class="form-group">
              <label>Valor pago (R$)</label>
              <input type="number" id="modal-valor" step="0.01" min="0" required>
            </div>
            <div class="form-group">
              <label>Data do pagamento</label>
              <input type="date" id="modal-data" required>
            </div>
            <div class="form-group">
              <label>Forma de pagamento</label>
              <select id="modal-forma" required>
                <option value="">Selecione a forma</option>
                <option value="DINHEIRO">Dinheiro</option>
                <option value="CARTAO">Cartão</option>
                <option value="PIX">PIX</option>
              </select>
            </div>
            <div id="modal-erro" style="color: #ef4444; font-size: 14px;"></div>
            <div class="btn-row">
              <button type="button" class="btn-secondary" onclick="fecharModal()">Cancelar</button>
              <button type="submit">Confirmar Pagamento</button>
            </div>
          </form>
        </div>
      </div>
    `;

    carregarMensalidades();
  </script>
</body>
</html>
